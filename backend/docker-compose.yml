services:
  postgres:
    image: postgres:16-alpine
    container_name: vastu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vastu_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vastu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vastu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vision_model:
    build:
      context: ../services/vision-model
      dockerfile: Dockerfile
    container_name: vastu_vision_model
    restart: unless-stopped
    environment:
      - MODEL_NAME=${LOCAL_VISION_MODEL:-yolov8n.pt}
      - DEVICE=${LOCAL_VISION_DEVICE:-auto}
      - CONFIDENCE_THRESHOLD=${LOCAL_VISION_CONFIDENCE_THRESHOLD:-0.50}
      - IMAGE_SIZE=${LOCAL_VISION_IMAGE_SIZE:-640}
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../services/vision-model/models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vastu_postgres_data:
    driver: local
